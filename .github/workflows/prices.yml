name: Update prices
on:
  schedule:
    - cron: "27 16 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-prices.mjs
      - run: node --test
      - name: Save daily snapshot
        run: |
          git config user.name "MagicBattle"
          git config user.email "126199569+MagicBattle@users.noreply.github.com"
          git add public/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update prices"
            git push
          fi
